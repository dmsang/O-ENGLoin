name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.1) - leave blank to read from VERSION file"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -z "$INPUT" ]; then
            VER=$(cat VERSION | tr -d "[:space:]")
          else
            VER="$INPUT"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT
          echo "Releasing version: $VER"

      - name: Update VERSION file if overridden
        if: github.event.inputs.version != ''
        run: |
          echo "${{ steps.ver.outputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E 's/APP_VERSION[[:space:]]*=[[:space:]]*"[^"]+"/APP_VERSION  = "${{ steps.ver.outputs.version }}"/' main.py
          git add VERSION main.py
          git diff --staged --quiet || git commit -m "chore: bump VERSION to ${{ steps.ver.outputs.version }}"
          git push

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.ver.outputs.tag }}
          git push origin ${{ steps.ver.outputs.tag }} --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "AWING Auto Login ${{ steps.ver.outputs.tag }}"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            main.py
            install.ps1
            install.cmd
            uninstall.ps1
            uninstall.cmd
            VERSION

